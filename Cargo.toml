[package]
name = "tapline"
version = "0.1.0"
edition = "2021"
description = "A simple rhythm game in your terminal"
license = "MIT"
repository = "https://github.com/unhappychoice/tapline"
readme = "README.md"

[[bin]]
name = "tapline"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["bmp", "png", "jpeg", "gif"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
rodio = { version = "0.23", default-features = false, features = ["playback", "hound", "lewton", "mp3"] }
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1"

[profile.release]
lto = true
strip = true

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build-and-test:
    name: build & test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Keep all Linux jobs on the same Ubuntu release.
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install ALSA dev headers (Linux)
        if: runner.os == 'Linux'
        run: |
          # Exclude the unreliable Azure mirror while preserving fallback mirrors.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|://azure\.archive\.ubuntu\.com/|d' /etc/apt/apt-mirrors.txt
          fi
          # Only require Ubuntu indexes for ALSA.
          sudo apt-get -o Acquire::Retries=3 -o APT::Update::Error-Mode=any \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- update
          sudo apt-get -o Acquire::Retries=3 install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --locked --release

      - name: cargo test
        run: cargo test --locked --all

  lint:
    name: fmt & clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install ALSA dev headers
        run: |
          # Exclude the unreliable Azure mirror while preserving fallback mirrors.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|://azure\.archive\.ubuntu\.com/|d' /etc/apt/apt-mirrors.txt
          fi
          # Only require Ubuntu indexes for ALSA.
          sudo apt-get -o Acquire::Retries=3 -o APT::Update::Error-Mode=any \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- update
          sudo apt-get -o Acquire::Retries=3 install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install ALSA dev headers
        run: |
          # Exclude the unreliable Azure mirror while preserving fallback mirrors.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|://azure\.archive\.ubuntu\.com/|d' /etc/apt/apt-mirrors.txt
          fi
          # Only require Ubuntu indexes for ALSA.
          sudo apt-get -o Acquire::Retries=3 -o APT::Update::Error-Mode=any \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- update
          sudo apt-get -o Acquire::Retries=3 install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: cargo llvm-cov
        run: cargo llvm-cov --locked --workspace --lcov --output-path lcov.info

      - name: cargo llvm-cov summary
        run: cargo llvm-cov report --summary-only

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: lcov.info
          fail_ci_if_error: false
